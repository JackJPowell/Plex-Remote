[project]
name = "plex-remote"
version = "0.1.0"
description = "Local media server automation API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "pillow>=11.0",
    "plexapi>=4.15",
    "python-dotenv>=1.0",
    "websockets>=15.0",
]

[project.scripts]
plex-remote = "main:main"
